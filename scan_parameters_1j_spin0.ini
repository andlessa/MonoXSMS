[MadGraphPars]
#MG5 Cards:
proccard = Cards/DMSimp_spin0/proc_card_1j.dat # Optional (only used if processFolder does not exist)
#paramcard = Cards/DMSimp_spin0/param_card_scalar.dat # Path to the default parameter_card.dat to be used by MadGraph. Note that the parameter values defined in the MadGraphSet section below will automatically overwrite the values in paramcard. If not defined, the default file for the model will be used.
paramcard = Cards/DMSimp_spin0/param_card_pseudoscalar.dat
runcard = Cards/DMSimp_spin0/run_card_single_bias.dat # Path to the default run_card.dat to be used by MadGraph. Note that the parameter values defined in the MadGraphSet section below will automatically overwrite the values in runcard. If not defined, the default file for the model will be used.
delphescard = Cards/delphes_card_trimmed.dat # If not defined, will not run Delphes
pythia8card = Cards/pythia8_card.dat # If not defined it will not run Pythia and Delphes
#processFolder = DMSimp_scalar_1j_ # Path to the folder to store the process generation output. If it already exists, the process generation will be #List of model parameters. Only values in this section are allowed as lists (for loops)
processFolder = DMSimp_pseudoscalar_cms_xdzpmap_add_add
[MadGraphSet]
nevents = 50000
MXd = ${AuxPars:massPairs}[0]
MY0 = ${AuxPars:massPairs}[1]
xqcut = 0.0
#xqcut = "%1.0f" %(max(45., max(2*${MXd}, ${MY0})/15.0))
#run_tag = "scalar_%1.0f_%1.0f" %(${MY0},${MXd})
run_tag = "pseudoscalar_%1.0f_%1.0f" %(${MY0},${MXd})

